# Nginx 配置 — 太阳与影子实验
# 部署后放入 /etc/nginx/conf.d/sun-shadow.conf
# 该配置配合网关，实际访问路径为 /UUID/sun-shadow/

server {
    listen 80;

    # 网关前缀（由 zhique gateway 传入 X-Forwarded-Prefix header）
    # 实际部署时 URL 为: https://gw-host/UUID/sun-shadow/

    location /sun-shadow/ {
        alias /data/__PROJECT_UUID__/sun-shadow-experiment/frontend/;

        # 关闭 gzip（使用 Brotli 预压缩文件）
        gzip off;

        # API 代理到 FastAPI 后端
        location /sun-shadow/api/ {
            proxy_pass http://127.0.0.1:9005/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # WebSocket 升级
        location /sun-shadow/ws/ {
            proxy_pass http://127.0.0.1:9005/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Unity WebGL Build 产物（Brotli 压缩）
        location ~ ^/sun-shadow/Build/.*\.br$ {
            alias /data/__PROJECT_UUID__/sun-shadow-experiment/static/;
            # 移除 "Build/" 重写路径的复杂性，直接 map
            # Nginx alias + regex 需要对路径做调整

            gzip off;
            add_header Content-Encoding br;
            add_header Content-Type application/octet-stream;
            add_header Access-Control-Allow-Origin *;
        }

        # Unity WebGL 其他文件（JS/WASM/DATA）
        location /sun-shadow/Build/ {
            alias /data/__PROJECT_UUID__/sun-shadow-experiment/static/Build/;
            gzip off;

            # Brotli content-encoding for compressed files
            location ~ \.data\.br$ {
                add_header Content-Encoding br;
                add_header Content-Type application/octet-stream;
                add_header Access-Control-Allow-Origin *;
            }
            location ~ \.wasm\.br$ {
                add_header Content-Encoding br;
                add_header Content-Type application/wasm;
                add_header Access-Control-Allow-Origin *;
            }
            location ~ \.js\.br$ {
                add_header Content-Encoding br;
                add_header Content-Type application/javascript;
                add_header Access-Control-Allow-Origin *;
            }
            location ~ \.symbols\.json\.br$ {
                add_header Content-Encoding br;
                add_header Content-Type application/octet-stream;
                add_header Access-Control-Allow-Origin *;
            }
        }

        # Unity TemplateData
        location /sun-shadow/TemplateData/ {
            alias /data/__PROJECT_UUID__/sun-shadow-experiment/static/TemplateData/;
            gzip off;
            add_header Access-Control-Allow-Origin *;
        }

        # CSS / JS 静态资源
        location /sun-shadow/css/ {
            alias /data/__PROJECT_UUID__/sun-shadow-experiment/frontend/css/;
        }
        location /sun-shadow/js/ {
            alias /data/__PROJECT_UUID__/sun-shadow-experiment/frontend/js/;
        }
    }

    # 健康检查
    location /sun-shadow/api/health {
        proxy_pass http://127.0.0.1:9005/api/health;
    }
}
