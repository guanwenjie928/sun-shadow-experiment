<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>太阳与影子 · 小学科学互动实验</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div>
    <span class="logo">🌞 太阳与影子</span>
    <span class="subtitle"> | 教科版 · 三年级科学</span>
  </div>
  <span style="font-size:.85rem">团结引擎 WebGL 互动实验</span>
</nav>

<section class="hero">
  <span class="emoji">🌍</span>
  <h1>太阳与影子 — 互动实验</h1>
  <p>拖动太阳，观察影子怎么变化！<br>适合小学 3~4 年级科学课堂</p>
</section>

<div class="grid-3">
  <a href="experiment" class="card" style="text-decoration:none;color:inherit;">
    <span class="icon">🔬</span>
    <h3>实验体验</h3>
    <p>进入 Unity WebGL 互动场景，拖动太阳观察影子变化规律</p>
  </a>

  <a href="student" class="card" style="text-decoration:none;color:inherit;">
    <span class="icon">📝</span>
    <h3>学生答题</h3>
    <p>12 个小组，观察实验后完成 10 道科学题目</p>
  </a>

  <a href="teacher" class="card" style="text-decoration:none;color:inherit;">
    <span class="icon">🖥️</span>
    <h3>教师大屏</h3>
    <p>实时查看各小组答题进度与得分情况</p>
  </a>
</div>

<div style="text-align:center;padding:40px 24px;color:var(--text-secondary);font-size:.85rem;">
  <p>推荐流程：打开实验 → 学生操作体验 → 进入答题 → 教师大屏查看结果</p>
  <p style="margin-top:8px">Built with Tuanjie 1.9.0 + FastAPI + MySQL</p>
</div>

</body>
</html>
